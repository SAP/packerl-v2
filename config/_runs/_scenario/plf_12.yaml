# @package _global_
# Run config for a scenario using the PLF topology family with inner_depth=12

defaults:
  - _plf
  - _self_

train_scenario:
  topology:
    graph:
      mode_configs:
        plf:
          inner_depth: 12

validation_scenario:
  topology:
    graph:
      mode_configs:
        plf:
          inner_depth: 12

eval_scenario:
  topology:
    graph:
      mode_configs:
        plf:
          inner_depth: 12